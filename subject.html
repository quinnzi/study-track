<script>

let coinsHere = 0



   const nameS = document.getElementById("subName")
   nameS.textContent = localStorage.getItem('subject')
   console.log(localStorage.getItem('subject'))
    const addSesh = document.getElementById("add")


    addSesh.addEventListener('click', ()=>{
    const studyNum = document.getElementById("StudNum").value
    const notes = document.getElementById("notes").value

    const searchValue = localStorage.getItem('subject')

    let seshData  = []
    if(!localStorage.getItem(searchValue))
   { seshData = []}
   else{
     seshData =  JSON.parse(localStorage.getItem(searchValue))
   }
  
    let points = 1 * studyNum
    if (studyNum > 30){
        const mul = studyNum - 30
        const sure = mul * 20
        points = 10 + sure
    }
 let prev = parseInt(localStorage.getItem('coins'))
 if(prev === null || !prev){
prev = 0
 }
 const total = prev + points
 localStorage.setItem('coins', total)
   const ses = {studyNum, notes, total}
    seshData.push(ses)
    localStorage.setItem(nameS.textContent, JSON.stringify(seshData))
    const container = document.createElement('div')
    container.className = "sesh"

    const timeS = document.createElement('h2')
    timeS.textContent = "Studied for:" + " " + studyNum + " minutes"

    const noteDisplay = document.createElement('p')
    noteDisplay.textContent = "Notes:" + notes

       container.appendChild(timeS)
         container.appendChild(noteDisplay)
    document.getElementById("sessions").appendChild(container)
    coinsHere = total
    })

 }
